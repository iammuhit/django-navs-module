<div id="modal-link-type" class="link-type-modal" style="display: none;">
    <div class="link-type-modal-content">
        <div class="link-type-modal-header">
            <h2>Select Link Type</h2>
            <button type="button" class="link-type-modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="link-type-modal-body">
            <p>Choose how you want to create this link:</p>
            <div class="link-type-options">
                <a href="#" class="link-type-option" data-type="page">
                    <div class="link-type-icon">📄</div>
                    <div class="link-type-label">Page</div>
                    <div class="link-type-description">Link to an existing page</div>
                </a>
                <a href="#" class="link-type-option" data-type="url_name">
                    <div class="link-type-icon">🔗</div>
                    <div class="link-type-label">Route</div>
                    <div class="link-type-description">Link to a named route pattern</div>
                </a>
                <a href="#" class="link-type-option" data-type="url">
                    <div class="link-type-icon">🌐</div>
                    <div class="link-type-label">URL</div>
                    <div class="link-type-description">Link to a custom URL</div>
                </a>
            </div>
        </div>
    </div>
</div>
